<!-- ?v= must match APP_VERSION in app.js and CACHE in sw.js — bump all three together.
     The service worker bypasses the HTTP cache itself, but the very first load of a
     new device has no worker yet, and the host serves these with max-age=600. The
     version query is what stops that first load being served a stale bundle. -->
<link rel="stylesheet" href="style.css?v=2.4.2">
</head>
<body>
<div id="app"></div>
<script src="app.js?v=2.4.2"></script>
